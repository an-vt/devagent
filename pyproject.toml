[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devagent"
version = "0.1.0"
description = "Initial Python scaffold for devagent."
requires-python = ">=3.11"
authors = [
    { name = "devagent" },
]
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "debugpy>=1.8.0",
    "ruff>=0.9.0",
]

[project.scripts]
devagent = "src.cli:main"

[tool.ruff]
line-length = 130
target-version = "py311"
